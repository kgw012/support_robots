<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 다크 인더스트리얼 보드 배경 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111827" stroke="#334155" stroke-width="3" />
  <!-- 십자 격자 라인 -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#1e293b" stroke-width="2" />
  <line x1="6" y1="32" x2="58" y2="32" stroke="#1e293b" stroke-width="2" />
  <!-- 중앙 탈출구(Target Zone) 심볼 -->
  <polygon points="32,19 45,32 32,45 19,32" fill="rgba(56, 189, 248, 0.18)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="32" cy="32" r="3.5" fill="#e0f2fe" />
  <!-- 4대의 서포트 로봇 (빨강, 초록, 파랑, 노랑) -->
  <circle cx="17" cy="17" r="7.5" fill="#e53935" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="47" cy="17" r="7.5" fill="#2e9e49" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="17" cy="47" r="7.5" fill="#1e88e5" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="47" cy="47" r="7.5" fill="#f5b400" stroke="#ffffff" stroke-width="2.2" />
</svg>

